# The Kotlin compiler runs in its own daemon, which otherwise inherits the Gradle heap. Compiling
# the dev, staging and production variants in parallel ran out of memory at 2 GB on CI
# («GC overhead limit exceeded» in compileStagingDebugKotlin); the hosted runner has 16 GB.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true
