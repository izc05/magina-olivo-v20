name: V20 routes municipal KML audit

on:
  pull_request:
    paths:
      - 'data/routes/sierra-magina-municipal-track-sources.json'
      - 'scripts/audit-municipal-kml.py'
      - '.github/workflows/routes-municipal-kml-audit.yml'
  push:
    branches:
      - feat/v20-routes-catalog-completion
    paths:
      - 'data/routes/sierra-magina-municipal-track-sources.json'
      - 'scripts/audit-municipal-kml.py'
      - '.github/workflows/routes-municipal-kml-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Audit municipal KML geometries
        continue-on-error: true
        run: python scripts/audit-municipal-kml.py --write data/routes/sierra-magina-municipal-kml-audit.json

      - name: Print audit summary
        if: always()
        run: |
          if [ -f data/routes/sierra-magina-municipal-kml-audit.json ]; then
            python - <<'PY'
          import json
          with open('data/routes/sierra-magina-municipal-kml-audit.json', encoding='utf-8') as handle:
              report = json.load(handle)
          print(json.dumps(report.get('summary', {}), indent=2, ensure_ascii=False))
          for row in report.get('routes', []):
              print(row.get('slug'), row.get('fetch_status'), row.get('point_count'), row.get('calculated_length_m'), row.get('validation_status'))
          PY
          else
            echo 'Municipal KML audit report was not generated.'
          fi

      - name: Upload municipal KML audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sierra-magina-municipal-kml-audit
          path: data/routes/sierra-magina-municipal-kml-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record external-source outcome
        if: always()
        run: |
          echo 'This audit is intentionally non-blocking.'
          echo 'A remote KML fetch failure is preserved as pending_external_fetch and does not make application CI red.'
