name: V20 weather radar map closure

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-weather-map
    paths:
      - 'apps/api/src/routes/radar.ts'
      - 'apps/api/src/routes/weather.ts'
      - 'apps/api/src/weather/**'
      - 'apps/api/src/testing/radar-*.ts'
      - 'apps/api/src/testing/weather-*.ts'
      - 'apps/api/src/testing/map-context-smoke.ts'
      - 'apps/worker/src/radar/**'
      - 'apps/worker/src/server.ts'
      - 'apps/web/src/components/farm-map.tsx'
      - 'apps/web/src/components/radar-observation-panel.tsx'
      - 'apps/web/src/lib/api-client.ts'
      - 'packages/weather/**'
      - 'packages/contracts/**'
      - 'packages/jobs/**'
      - 'database/migrations/**'
      - 'e2e/weather-radar-map.spec.ts'
      - 'playwright.config.ts'
      - '.env.example'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/weather-map-closure.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_weather_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_weather_map"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Bootstrap lockfile for isolated legacy branch
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm i --lockfile-only --no-frozen-lockfile
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck and build product graph
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_PREVIEW_MODE: 'false'
        run: |
          pnpm typecheck
          pnpm build

      - name: Validate radar science boundary
        run: |
          node packages/weather/dist/testing/radar-geotiff-smoke.js
          node packages/weather/dist/testing/radar-palette-smoke.js
          node packages/weather/dist/testing/radar-geotiff-inspection-smoke.js
          node packages/weather/dist/testing/radar-spatial-analysis-smoke.js
          node apps/api/dist/testing/radar-overlay-smoke.js

      - name: Apply migrations and seed isolated weather-map fixtures
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_weather_map -v ON_ERROR_STOP=1 -f "${migration}"
          done

          psql -h 127.0.0.1 -U postgres -d magina_weather_map -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO workspaces (id, name, type)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'Weather CI Workspace', 'family'),
            ('aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa', 'Weather Browser Workspace', 'family');

          INSERT INTO users (id, primary_email, display_name, status)
          VALUES ('bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb', 'weather-e2e@example.invalid', 'Agricultor Weather E2E', 'active');

          INSERT INTO workspace_memberships (workspace_id, user_id, role, status)
          VALUES ('aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa', 'bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb', 'owner', 'active');

          INSERT INTO fields (
            id, workspace_id, client_operation_id, name, municipality, province, municipality_id,
            tree_count, crop, variety, water_regime, status, geometry, calculated_area_ha,
            geometry_source, geometry_status, geometry_checked_at
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111',
            '44444444-4444-4444-8444-444444444444',
            'Finca Weather CI', 'Huelma', 'Jaén',
            (SELECT id FROM territory_municipalities WHERE ine_code = '23044'),
            23, 'olivar', 'picual', 'secano', 'active',
            ST_Multi(ST_GeomFromText('POLYGON((-3.50 37.70,-3.49 37.70,-3.49 37.71,-3.50 37.71,-3.50 37.70))', 4326)),
            1.2, 'manual', 'verified', now()
          ), (
            'dddddddd-4444-4444-8444-dddddddddddd',
            'aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa',
            'eeeeeeee-5555-4555-8555-eeeeeeeeeeee',
            'Finca Mobile Audit', 'Huelma', 'Jaén',
            (SELECT id FROM territory_municipalities WHERE ine_code = '23044'),
            80, 'olivar', 'picual', 'secano', 'active',
            ST_Multi(ST_GeomFromText('POLYGON((-3.505 37.700,-3.495 37.700,-3.495 37.710,-3.505 37.710,-3.505 37.700))', 4326)),
            1.3, 'manual', 'verified', now()
          );

          INSERT INTO radar_snapshots (
            id, source, product, crs, observed_at, fetched_at, asset_format, analysis_ready,
            content_type, byte_size, sha256, source_url, storage_key, status, metadata_json
          ) VALUES (
            '99999999-aaaa-4aaa-8aaa-999999999999',
            'aemet_national_mosaic', 'reflectivity', 'EPSG:4326', now(), now(), 'geotiff', true,
            'image/tiff', 100, repeat('d', 64),
            'https://www.aemet.es/es/api-eltiempo/radar/download/compo',
            'weather/radar/browser-fixture.tif', 'processed',
            '{"geotiff_inspection":{"analysisReady":true,"crs":"EPSG:4326","bbox":[-9.5,35.5,4.5,44.5]}}'::jsonb
          );

          INSERT INTO farm_radar_observations (
            id, workspace_id, field_id, radar_snapshot_id, analysis_version, observed_at,
            coverage_status, precipitation_detected, nearest_echo_distance_km, direction_degrees,
            direction_label, reflectivity_dbz_min, reflectivity_dbz_max, representative_dbz,
            analysis_radius_km, quality_flags, metadata_json
          ) VALUES (
            '88888888-bbbb-4bbb-8bbb-888888888888',
            'aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa',
            'dddddddd-4444-4444-8444-dddddddddddd',
            '99999999-aaaa-4aaa-8aaa-999999999999',
            'aemet-national-palette-v1-spatial-v1', now(),
            'covered', true, 8.4, 270, 'W', 18, 24, NULL, 80,
            ARRAY['palette_mapping_v1'], '{}'::jsonb
          );
          SQL

      - name: API weather radar and geometry behavior
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_weather_map
          ALLOW_DEV_AUTH_HEADERS: 'true'
          AUTH_COOKIE_SECURE: 'false'
          RADAR_STALE_AFTER_MINUTES: '30'
          PGPASSWORD: postgres
        run: |
          node apps/api/dist/testing/weather-cache-smoke.js
          node apps/api/dist/testing/radar-latest-smoke.js
          node apps/api/dist/testing/map-context-smoke.js
          psql -h 127.0.0.1 -U postgres -d magina_weather_map -v ON_ERROR_STOP=1 -c "UPDATE weather_forecast_cache SET fetched_at = now(), expires_at = now() + interval '1 hour', last_error_at = NULL, last_error_code = NULL WHERE municipality_id = (SELECT id FROM territory_municipalities WHERE ine_code = '23044') AND provider = 'aemet_daily';"

      - name: Browser and mobile weather-map behavior
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_weather_map
          ALLOW_DEV_AUTH_HEADERS: 'true'
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_PREVIEW_MODE: 'false'
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_WORKSPACE_ID: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
          E2E_USER_ID: bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb
          RADAR_STALE_AFTER_MINUTES: '30'
        run: |
          node apps/api/dist/server.js >/tmp/magina-api-weather-map.log 2>&1 &
          API_PID=$!
          pnpm --filter @magina/web start --hostname 127.0.0.1 --port 3000 >/tmp/magina-web-weather-map.log 2>&1 &
          WEB_PID=$!
          trap 'kill ${API_PID} ${WEB_PID} 2>/dev/null || true; echo "--- API LOG ---"; cat /tmp/magina-api-weather-map.log; echo "--- WEB LOG ---"; cat /tmp/magina-web-weather-map.log' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null && curl -fsS http://127.0.0.1:3000/radar >/dev/null; then
              break
            fi
            sleep 1
          done

          pnpm exec playwright test e2e/weather-radar-map.spec.ts

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weather-radar-map-debug
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
