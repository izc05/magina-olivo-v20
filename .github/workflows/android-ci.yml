name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Verify preinstalled Android 37 SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms"
          ls -1 "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Verify pinned Gradle runner
        run: gradle --version

      - name: Lint, unit test, compile instrumented tests and build all environments
        run: gradle --no-daemon lintDevDebug testDevDebugUnitTest assembleDevDebug assembleStagingDebug assembleProductionDebug assembleDevDebugAndroidTest

      - name: Upload DEV APK
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: magina-olivo-dev-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14

  gate3-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Gate 3 instrumented QA on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            mkdir -p gate3-evidence

            adb shell wm size 1080x2400
            adb shell wm density 480
            adb shell settings put system font_scale 1.0
            gradle --no-daemon connectedDevDebugAndroidTest
            gradle --no-daemon installDevDebug
            adb shell am force-stop com.isivoltpro.maginaolivo.dev
            adb shell am start -W -n com.isivoltpro.maginaolivo.dev/com.isivoltpro.maginaolivo.MainActivity
            sleep 2
            adb exec-out screencap -p > gate3-evidence/360dp.png

            adb shell wm density 440
            adb shell settings put system font_scale 1.3
            gradle --no-daemon connectedDevDebugAndroidTest
            gradle --no-daemon installDevDebug
            adb shell am force-stop com.isivoltpro.maginaolivo.dev
            adb shell am start -W -n com.isivoltpro.maginaolivo.dev/com.isivoltpro.maginaolivo.MainActivity
            sleep 2
            adb exec-out screencap -p > gate3-evidence/393dp-font130.png

            adb shell wm density 360
            adb shell settings put system font_scale 1.0
            gradle --no-daemon connectedDevDebugAndroidTest
            gradle --no-daemon installDevDebug
            adb shell am force-stop com.isivoltpro.maginaolivo.dev
            adb shell am start -W -n com.isivoltpro.maginaolivo.dev/com.isivoltpro.maginaolivo.MainActivity
            sleep 2
            adb exec-out screencap -p > gate3-evidence/480dp.png

            adb shell settings put global animator_duration_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global window_animation_scale 0
            gradle --no-daemon connectedDevDebugAndroidTest

            mkdir -p gate3-evidence/reference-screens
            for file in \
              parcel-detail-360dp-font100.png \
              parcel-detail-393dp-font130.png \
              parcel-detail-480dp-font100.png \
              ocr-review-360dp-font100.png \
              ocr-review-393dp-font130.png \
              ocr-review-480dp-font100.png; do
              adb shell test -f "/sdcard/gate3/$file"
            done
            adb pull /sdcard/gate3/. gate3-evidence/reference-screens/

      - name: Upload Gate 3 emulator evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate3-emulator-evidence
          path: |
            gate3-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
