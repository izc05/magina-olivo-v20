name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Verify preinstalled Android 37 SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms"
          ls -1 "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Generate pinned Gradle wrapper
        run: gradle wrapper --gradle-version 9.4.1 --distribution-type bin

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Upload generated wrapper for repository bootstrap
        uses: actions/upload-artifact@v6
        with:
          name: gradle-wrapper-9.4.1
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14

      - name: Lint, unit test, compile instrumented tests and build DEV APK
        run: ./gradlew --no-daemon lintDevDebug testDevDebugUnitTest assembleDevDebug assembleDevDebugAndroidTest

      - name: Upload DEV APK
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: magina-olivo-dev-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
