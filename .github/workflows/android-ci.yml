name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    # Feature and hotfix branches are validated on push, so a branch can reach a green
    # emulator run before anyone opens a pull request for it.
    branches:
      - main
      - "feat/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Verify preinstalled Android 37 SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms"
          ls -1 "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Verify pinned Gradle runner
        run: gradle --version

      - name: Lint, unit test, compile instrumented tests and build all environments
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon lintDevDebug testDevDebugUnitTest assembleDevDebug assembleStagingDebug assembleProductionDebug assembleDevDebugAndroidTest 2>&1 | tee build-output.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build diagnostics"
            echo "### Compiler errors"
            echo '```'
            grep -E "^(e: |FAILURE: |Caused by: |\* What went wrong:|\* Exception is:)" build-output.log | head -200 || true
            echo '```'
            echo "### Tail of build output"
            echo '```'
            tail -150 build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Compiler errors first, then the tail unconditionally: Gradle puts the reason
          # a build failed (a failing test, a missing file) in the lines that follow
          # "What went wrong", which no single-line pattern catches.
          {
            grep -E "^(e: |w: .*error)" build-output.log | head -40
            echo "--- tail ---"
            tail -50 build-output.log
          } > annotation.txt
          encoded=$(sed -e 's/%/%25/g' -e 's/\r//g' annotation.txt | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=Gradle build failure::${encoded}"

      - name: Publish exported Room schema
        if: success()
        shell: bash
        run: |
          {
            echo "## Exported Room schema (latest version)"
            latest=$(find app/schemas -name '*.json' | sort -V | tail -1)
            echo "File: \`$latest\`"
            echo '```json'
            cat "$latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Also on a push, because a feature branch now reaches CI before a pull request
      # exists, and the migration test cannot run until the compiler-exported schema is
      # in the branch. Never on main: its schema arrives with the branch that made it.
      - name: Commit the exported Room schema
        if: >-
          success() && github.ref_name != 'main' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain app/schemas)" ]; then
            echo "The exported schema already matches the committed one"
            exit 0
          fi
          staging="$(mktemp -d)"
          cp -R app/schemas/. "$staging/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$HEAD_REF"
          git checkout -B schema-export FETCH_HEAD
          mkdir -p app/schemas
          cp -R "$staging/." app/schemas/
          git add app/schemas
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -m "chore(android): publish the Room schema exported by the compiler"
          git push origin HEAD:"$HEAD_REF"

      - name: Upload DEV APK
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: magina-olivo-dev-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 14

  gate3-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Build Gate 3 candidate
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDevDebugUnitTest assembleDevDebug assembleDevDebugAndroidTest 2>&1 | tee build-output.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build diagnostics"
            echo "### Compiler errors"
            echo '```'
            grep -E "^(e: |FAILURE: |Caused by: |\* What went wrong:|\* Exception is:)" build-output.log | head -200 || true
            echo '```'
            echo "### Tail of build output"
            echo '```'
            tail -150 build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Compiler errors first, then the tail unconditionally: Gradle puts the reason
          # a build failed (a failing test, a missing file) in the lines that follow
          # "What went wrong", which no single-line pattern catches.
          {
            grep -E "^(e: |w: .*error)" build-output.log | head -40
            echo "--- tail ---"
            tail -50 build-output.log
          } > annotation.txt
          encoded=$(sed -e 's/%/%25/g' -e 's/\r//g' annotation.txt | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=Gradle build failure::${encoded}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Gate 3 instrumented QA on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/gate3-emulator-evidence.sh

      - name: Upload Gate 3 emulator evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate3-emulator-evidence
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
