name: Deploy weather functions

# CR-006: deploys `weather-forecast` and `weather-radar` from this repository with JWT
# verification ON (no --no-verify-jwt), then makes ONE real call for Bedmar y Garcíez (23019)
# and the radar, and keeps both responses as the validation artifact. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-weather-functions
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: zzelvbcuxsboafibfxch
      FUNCTIONS_URL: https://zzelvbcuxsboafibfxch.supabase.co/functions/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fixture tests before deploying
        run: node --experimental-strip-types --test supabase/functions/*/*.test.ts

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a secret key"; exit 1;; esac

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy (verify_jwt stays on)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy weather-forecast --project-ref "$PROJECT_REF"
          supabase functions deploy weather-radar --project-ref "$PROJECT_REF"

      - name: Real call — Bedmar y Garcíez (23019) and radar
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p evidence
          call() {
            curl -sS -m 30 -X POST "$FUNCTIONS_URL/$1" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -d "$2" -o "evidence/$3" -w "%{http_code}"
          }
          forecast=$(call weather-forecast '{"municipalityCode":"23019"}' weather-forecast-bedmar-23019.json)
          radar=$(call weather-radar '{"operation":"frames"}' weather-radar-frames.json)
          # JWT verification proof: the same call without the key must be refused.
          unauth=$(curl -sS -m 30 -X POST "$FUNCTIONS_URL/weather-forecast" -H "Content-Type: application/json" \
            -d '{"municipalityCode":"23019"}' -o /dev/null -w "%{http_code}")
          {
            echo "## Weather functions — real validation"
            echo "- weather-forecast (23019): HTTP $forecast"
            echo "- weather-radar (frames): HTTP $radar"
            echo "- weather-forecast without key: HTTP $unauth (must be 401)"
            echo '```json'
            cat evidence/weather-forecast-bedmar-23019.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$forecast" = "200" && test "$radar" = "200" && test "$unauth" = "401"

      - name: Keep the real responses
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weather-functions-validation
          path: evidence/
          retention-days: 30
