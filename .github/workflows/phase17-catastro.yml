name: Phase 17 Catastro live import

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/phase17-catastro"
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - ".github/workflows/phase17-catastro.yml"

permissions:
  contents: read

jobs:
  real-parcel-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Build application and instrumented test
        run: gradle --no-daemon assembleDevDebug assembleDevDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Query and import a real parcel on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t "$(find app/build/outputs/apk/dev/debug -name '*.apk' | head -n 1)"
            adb install -r -t "$(find app/build/outputs/apk/androidTest -name '*.apk' | head -n 1)"
            adb shell am instrument -w -e class com.isivoltpro.maginaolivo.CatastroLiveImportTest \
              com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee catastro-live-test.txt
            grep -q 'OK (1 test)' catastro-live-test.txt
      - name: Upload Gate 17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catastro-live-import-evidence
          path: catastro-live-test.txt
          if-no-files-found: warn
