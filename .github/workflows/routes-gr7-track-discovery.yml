name: V20 routes GR7 track discovery

on:
  push:
    branches:
      - feat/v20-routes-catalog-completion
    paths:
      - 'scripts/discover-gr7-stage-tracks.py'
      - '.github/workflows/routes-gr7-track-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Discover published GR-7 stage track links
        continue-on-error: true
        run: python scripts/discover-gr7-stage-tracks.py --write data/routes/sierra-magina-gr7-stage-track-discovery.json

      - name: Print discovery summary
        if: always()
        run: |
          if [ -f data/routes/sierra-magina-gr7-stage-track-discovery.json ]; then
            python - <<'PY'
          import json
          with open('data/routes/sierra-magina-gr7-stage-track-discovery.json', encoding='utf-8') as handle:
              report = json.load(handle)
          print('candidate_links:', len(report.get('candidate_links', [])))
          for row in report.get('candidate_links', []):
              print(row.get('index'), row.get('text'), row.get('absolute_url'))
          PY
          else
            echo 'Discovery report was not generated.'
          fi

      - name: Upload GR-7 discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sierra-magina-gr7-stage-track-discovery
          path: data/routes/sierra-magina-gr7-stage-track-discovery.json
          if-no-files-found: warn
          retention-days: 14
