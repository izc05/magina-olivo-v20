name: G1c Android journal QA
on:
  pull_request:
    branches: [feat/g1c-reservation-contract]
    paths:
      - .github/workflows/g1c-android-journal-qa.yml
      - .github/scripts/test-g1c-journal-process.sh
      - .github/scripts/test-g1c-journal-process-harness.sh
      - app/src/androidTest/java/com/isivoltpro/maginaolivo/G1cJournalProcessTest.kt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-journal-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: 9.4.1
          cache-provider: basic
      - name: Verify guarded process harness with fake adb
        run: |
          bash .github/scripts/test-gate3-emulator-safe.sh
          bash .github/scripts/test-g1c-journal-process-harness.sh
          bash .github/scripts/test-install-gate3-sdk-image.sh
      - name: Build matching DEV pair
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=1 --no-parallel assembleDevDebug assembleDevDebugAndroidTest 2>&1 | tee build-output.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Provision image with bounded retries
        run: bash .github/scripts/install-gate3-sdk-image.sh
      - name: Exercise three Android process boundaries
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: GATE3_ALLOW_APP_DATA_RESET=1 bash .github/scripts/test-g1c-journal-process.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: g1c-android-journal-process
          path: |
            evidence/g1c-journal-process/
            build-output.log
          retention-days: 14
