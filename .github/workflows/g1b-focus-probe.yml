name: G1b Focus Probe

# Diagnostic workflow for the intermittent RootViewWithoutFocusException of
# AppNavigationTest. Manual dispatch only: it never runs on push or on a pull
# request, it gates nothing, and it modifies no existing workflow or script.
on:
  push:
    branches:
      - qa/g1b-focus-probe
  workflow_dispatch:
    inputs:
      iterations:
        description: How many times to run the focus test
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  g1b-focus-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Build the DEV QA pair
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDevDebug assembleDevDebugAndroidTest 2>&1 | tee probe-build.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Provision Android image with bounded retries
        run: bash .github/scripts/install-gate3-sdk-image.sh

      - name: Run the focus probe
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          FOCUS_PROBE_ITERATIONS: ${{ inputs.iterations || '6' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/g1b-focus-probe.sh

      - name: Upload focus probe evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g1b-focus-probe
          path: |
            evidence/g1b-focus-probe/
            probe-build.log
          if-no-files-found: warn
          retention-days: 14
