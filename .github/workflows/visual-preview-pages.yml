name: V20 visual preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype

permissions:
  contents: read

concurrency:
  group: v20-visual-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-pages-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**') }}
          restore-keys: |
            ${{ runner.os }}-next-pages-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build static preview
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/magina-olivo-v20'
          NEXT_PUBLIC_PREVIEW_MODE: 'true'
        run: pnpm --filter @magina/web build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
