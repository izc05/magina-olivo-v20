name: V20 route activity check

on:
  pull_request:
    branches:
      - feat/v20-routes-adventure
      - feat/v20-routes-explore
      - integrate/v20-beta-closure
    paths:
      - 'apps/api/src/routes/route-activity.ts'
      - 'apps/api/src/routes/route-activity.test.ts'
      - 'apps/api/src/routes/route-adventure-hub.ts'
      - 'apps/api/src/routes/route-device-export.ts'
      - 'apps/web/src/app/rutas/detalle/route-activity-recorder.tsx'
      - 'apps/web/src/app/rutas/detalle/route-detail-client.tsx'
      - 'apps/web/src/app/perfil/page.tsx'
      - 'apps/web/src/components/route-activity-history.tsx'
      - 'apps/web/src/lib/route-activity-source.ts'
      - 'database/migrations/0085_route_activity_recordings.sql'
      - 'docs/v20-route-activity-recording.md'
      - '.github/workflows/routes-activity-check.yml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  activity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_activity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_activity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_activity
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_PREVIEW_MODE: 'false'
      ALLOW_DEV_AUTH_HEADERS: 'true'
      AUTH_COOKIE_SECURE: 'false'
      BACKGROUND_JOBS_ENABLED: 'false'
      RATE_LIMIT_ENABLED: 'false'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration sequence
        run: pnpm check:migrations

      - name: Typecheck API and web
        run: |
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/web typecheck

      - name: Build API and web
        run: |
          pnpm --filter @magina/api build
          pnpm --filter @magina/web build

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply all migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_activity -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Verify recording schema privacy defaults
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d magina_activity -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE indexname = 'route_activity_recordings_one_active_per_user_idx'
            ) THEN
              RAISE EXCEPTION 'one-active-recording index missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'route_activity_recordings'
                AND column_name = 'visibility'
                AND column_default = '''private''::text'
            ) THEN
              RAISE EXCEPTION 'recordings must default to private';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'route_activity_points'
                AND column_name = 'location'
            ) THEN
              RAISE EXCEPTION 'activity point location missing';
            END IF;
          END $$;
          SQL

      - name: Activity API lifecycle and privacy integration test
        run: pnpm --filter @magina/api exec tsx --test src/routes/route-activity.test.ts
