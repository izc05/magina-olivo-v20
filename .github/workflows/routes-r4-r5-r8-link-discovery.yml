name: V20 routes R4 R5 R8 link discovery

on:
  push:
    branches:
      - feat/v20-routes-catalog-completion
    paths:
      - 'scripts/discover-intermodal-missing-track-links.py'
      - '.github/workflows/routes-r4-r5-r8-link-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover published links
        continue-on-error: true
        run: python scripts/discover-intermodal-missing-track-links.py --write data/routes/sierra-magina-r4-r5-r8-link-discovery.json

      - name: Print result summary
        if: always()
        run: |
          if [ -f data/routes/sierra-magina-r4-r5-r8-link-discovery.json ]; then
            python - <<'PY'
          import json
          with open('data/routes/sierra-magina-r4-r5-r8-link-discovery.json', encoding='utf-8') as handle:
              report = json.load(handle)
          for row in report.get('routes', []):
              print(row.get('code'), row.get('fetch_status'), 'explicit_track_links=', len(row.get('explicit_track_links', [])))
              for item in row.get('explicit_track_links', []):
                  print(' ', item.get('score'), item.get('text'), item.get('absolute_url'))
          PY
          else
            echo 'Discovery report missing.'
          fi

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sierra-magina-r4-r5-r8-link-discovery
          path: data/routes/sierra-magina-r4-r5-r8-link-discovery.json
          if-no-files-found: warn
          retention-days: 14
