name: Edge functions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  weather-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fixture tests only: no network call to AEMET, MET Norway or RainViewer.
      - name: Weather function tests
        run: node --experimental-strip-types --test supabase/functions/*/*.test.ts
