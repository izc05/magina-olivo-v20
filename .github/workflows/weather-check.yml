name: V20 weather and territory check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/src/weather/**'
      - 'apps/api/src/routes/weather.ts'
      - 'apps/api/src/routes/territory.ts'
      - 'apps/api/src/testing/weather-*.ts'
      - 'apps/api/src/testing/radar-*.ts'
      - 'apps/api/src/app.ts'
      - 'packages/contracts/src/radar.ts'
      - 'packages/contracts/src/index.ts'
      - 'packages/weather/**'
      - 'database/migrations/0013_territory_catalog.sql'
      - 'database/migrations/0014_weather_forecast_cache.sql'
      - 'database/migrations/0015_radar_snapshots.sql'
      - '.github/workflows/weather-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  weather:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_weather
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_weather"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build contracts, weather, jobs and API
        run: |
          pnpm --filter @magina/contracts typecheck
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather typecheck
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build

      - name: AEMET forecast parser smoke
        run: node apps/api/dist/testing/weather-adapter-smoke.js

      - name: AEMET standard radar adapter smoke
        run: node apps/api/dist/testing/radar-adapter-smoke.js

      - name: AEMET GeoTIFF bundle parser smoke
        run: node packages/weather/dist/testing/radar-geotiff-smoke.js

      - name: Radar GeoTIFF metadata inspection smoke
        run: node packages/weather/dist/testing/radar-geotiff-inspection-smoke.js

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply migrations and seed finca weather scope
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_weather -v ON_ERROR_STOP=1 -f "${migration}"
          done
          psql -h 127.0.0.1 -U postgres -d magina_weather -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO workspaces (id, name, type)
          VALUES ('11111111-1111-4111-8111-111111111111', 'Weather CI Workspace', 'family');

          INSERT INTO fields (
            id, workspace_id, client_operation_id, name, municipality, province, municipality_id,
            tree_count, crop, variety, water_regime, status
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111',
            '44444444-4444-4444-8444-444444444444',
            'Finca Weather CI', 'Huelma', 'Jaén',
            (SELECT id FROM territory_municipalities WHERE ine_code = '23044'),
            23, 'olivar', 'picual', 'secano', 'active'
          );
          SQL

      - name: Shared cache, place mapping and stale fallback smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_weather
          ALLOW_DEV_AUTH_HEADERS: 'true'
          AUTH_COOKIE_SECURE: 'false'
        run: node apps/api/dist/testing/weather-cache-smoke.js
