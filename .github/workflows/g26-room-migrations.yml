name: G2.6 Room migration gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-migrations-api35:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Compile temporary debug test pair
        run: gradle --no-daemon --max-workers=1 --no-parallel assembleDevDebug assembleDevDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Validate Room migrations on disposable API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/dev/debug/app-dev-debug.apk
            adb install -r app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.isivoltpro.maginaolivo.data.local.RoomMigrationTest com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/g26-room-migrations.txt
            grep -q 'INSTRUMENTATION_CODE: -1' /tmp/g26-room-migrations.txt
            grep -Eq 'OK \([0-9]+ tests\)' /tmp/g26-room-migrations.txt
