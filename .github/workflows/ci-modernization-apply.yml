name: V20 CI modernization artifact

on:
  pull_request:
    paths:
      - 'scripts/modernize-ci.mjs'
      - '.github/workflows/ci-modernization-apply.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/v20-cleanup-structure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Apply mechanical workflow modernization
        run: node scripts/modernize-ci.mjs --write

      - name: Verify transformed CI audit
        run: node scripts/audit-ci.mjs --strict

      - name: Upload modernized workflows
        uses: actions/upload-artifact@v7
        with:
          name: modernized-workflows
          path: .github/workflows
          if-no-files-found: error
          retention-days: 1
