name: V20 lockfile candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'services/**/package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/lockfile-generation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-lockfile-candidate
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
