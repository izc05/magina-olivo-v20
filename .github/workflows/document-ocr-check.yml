name: V20 documents OCR metadata check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/contracts/**'
      - 'packages/jobs/**'
      - 'packages/weather/**'
      - 'database/migrations/**'
      - '.github/workflows/document-ocr-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts, weather, jobs, API and worker
        run: |
          pnpm --filter @magina/contracts typecheck
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather typecheck
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs typecheck
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build
          pnpm --filter @magina/worker typecheck
          pnpm --filter @magina/worker build

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply migrations and seed integration scope
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d magina -v ON_ERROR_STOP=1 -f "${migration}"
          done
          psql -h 127.0.0.1 -U postgres -d magina -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO workspaces (id, name, type)
          VALUES ('11111111-1111-4111-8111-111111111111', 'CI Workspace', 'family');
          INSERT INTO campaigns (id, workspace_id, name, start_date, status)
          VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', '2026/27', '2026-09-01', 'active');
          INSERT INTO fields (
            id, workspace_id, client_operation_id, name, tree_count, crop, water_regime, status
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111',
            '44444444-4444-4444-8444-444444444444',
            'Finca CI', 23, 'olivar', 'secano', 'active'
          );
          SQL

      - name: Document and OCR metadata smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina
          ALLOW_DEV_AUTH_HEADERS: 'true'
        run: node apps/api/dist/testing/document-smoke.js

      - name: pg-boss OCR worker smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina
        run: node apps/worker/dist/testing/worker-smoke.js
