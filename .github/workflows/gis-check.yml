name: V20 GIS finca selector check

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gis-fincas
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/src/gis/**'
      - 'apps/api/src/routes/gis.ts'
      - 'apps/api/src/routes/fields.ts'
      - 'apps/api/src/testing/gis-*.ts'
      - 'apps/api/src/testing/map-context-smoke.ts'
      - 'apps/api/src/app.ts'
      - 'apps/api/package.json'
      - 'apps/web/src/components/farm-gis-selector.tsx'
      - 'apps/web/src/components/new-farm-wizard.tsx'
      - 'apps/web/src/components/farm-edit-client.tsx'
      - 'apps/web/src/components/farm-edit-shortcut.tsx'
      - 'apps/web/src/app/mi-campo/fincas/editar/**'
      - 'apps/web/src/app/mi-campo/fincas/ver/page.tsx'
      - 'packages/contracts/src/gis.ts'
      - 'packages/contracts/src/mi-campo.ts'
      - 'packages/contracts/src/index.ts'
      - 'database/migrations/0012_gis_land_references.sql'
      - 'e2e/gis-finca.spec.ts'
      - 'e2e/beta-farmer.spec.ts'
      - 'playwright.config.ts'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gis-check.yml'
  pull_request:
    branches:
      - integrate/v20-beta-closure
    paths:
      - 'apps/api/src/gis/**'
      - 'apps/api/src/routes/gis.ts'
      - 'apps/api/src/routes/fields.ts'
      - 'apps/api/src/testing/gis-*.ts'
      - 'apps/api/src/testing/map-context-smoke.ts'
      - 'apps/web/src/components/farm-gis-selector.tsx'
      - 'apps/web/src/components/new-farm-wizard.tsx'
      - 'apps/web/src/components/farm-edit-client.tsx'
      - 'apps/web/src/components/farm-edit-shortcut.tsx'
      - 'apps/web/src/app/mi-campo/fincas/editar/**'
      - 'apps/web/src/app/mi-campo/fincas/ver/page.tsx'
      - 'packages/contracts/src/gis.ts'
      - 'packages/contracts/src/mi-campo.ts'
      - 'database/migrations/0012_gis_land_references.sql'
      - 'e2e/gis-finca.spec.ts'
      - 'e2e/beta-farmer.spec.ts'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gis-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_gis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_gis
      ALLOW_DEV_AUTH_HEADERS: 'true'
      AUTH_COOKIE_SECURE: 'false'
      BACKGROUND_JOBS_ENABLED: 'false'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_PREVIEW_MODE: 'false'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WORKSPACE_ID: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
      E2E_USER_ID: bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb
      E2E_GIS_FIXTURES: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build contracts, API and web
        run: |
          pnpm --filter @magina/contracts typecheck
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather typecheck
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build
          pnpm --filter @magina/web typecheck
          pnpm --filter @magina/web build

      - name: Offline GIS adapter smoke
        run: node apps/api/dist/testing/gis-adapter-smoke.js

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply migrations and seed GIS scope
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_gis -v ON_ERROR_STOP=1 -f "${migration}"
          done
          psql -h 127.0.0.1 -U postgres -d magina_gis -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, primary_email, display_name, status)
          VALUES
            ('bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb', 'gis-e2e@example.invalid', 'Agricultor GIS E2E', 'active')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO workspaces (id, name, type)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'GIS CI Workspace', 'family'),
            ('aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa', 'GIS Browser Workspace', 'family')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO workspace_memberships (workspace_id, user_id, role, status)
          VALUES ('aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa', 'bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb', 'owner', 'active')
          ON CONFLICT (workspace_id, user_id) DO NOTHING;

          INSERT INTO fields (
            id, workspace_id, client_operation_id, name, description, municipality, province,
            tree_count, crop, variety, water_regime, status
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111',
            '44444444-4444-4444-8444-444444444444',
            'Finca GIS CI', NULL, 'Bedmar', 'Jaén', 23, 'olivar', 'picual', 'secano', 'active'
          )
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: PostGIS land reference smoke
        run: node apps/api/dist/testing/gis-smoke.js

      - name: Unified finca map context smoke
        run: node apps/api/dist/testing/map-context-smoke.js

      - name: Finca create-edit-geometry API smoke
        run: node apps/api/dist/testing/gis-finca-flow-smoke.js

      - name: Start deterministic GIS browser servers
        run: |
          nohup node apps/api/dist/testing/gis-e2e-server.js >/tmp/magina-gis-api-e2e.log 2>&1 &
          echo $! >/tmp/magina-gis-api-e2e.pid
          nohup pnpm --filter @magina/web start --hostname 127.0.0.1 --port 3000 >/tmp/magina-gis-web-e2e.log 2>&1 &
          echo $! >/tmp/magina-gis-web-e2e.pid

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3001/health
          curl -fsS http://127.0.0.1:3000/ >/dev/null

      - name: Browser checkpoint — selector opens
        run: pnpm exec playwright test e2e/gis-finca.spec.ts --grep "selector GIS aparece"

      - name: Browser checkpoint — Catastro to SIGPAC persistence
        run: pnpm exec playwright test e2e/gis-finca.spec.ts --grep "alta GIS real persiste"

      - name: Browser checkpoint — unlocated recovery
        run: pnpm exec playwright test e2e/gis-finca.spec.ts --grep "finca sin geometría se guarda"

      - name: Browser checkpoint — provider error preserves state
        run: pnpm exec playwright test e2e/gis-finca.spec.ts --grep "error de proveedor mantiene"

      - name: Stop GIS browser servers
        if: always()
        run: |
          kill "$(cat /tmp/magina-gis-api-e2e.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/magina-gis-web-e2e.pid 2>/dev/null)" 2>/dev/null || true
          echo "--- GIS API LOG ---"
          cat /tmp/magina-gis-api-e2e.log 2>/dev/null || true
          echo "--- WEB LOG ---"
          cat /tmp/magina-gis-web-e2e.log 2>/dev/null || true

      - name: Upload GIS browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gis-finca-selector-e2e-debug
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
