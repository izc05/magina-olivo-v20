name: V20 GIS land references check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/src/gis/**'
      - 'apps/api/src/routes/gis.ts'
      - 'apps/api/src/testing/gis-*.ts'
      - 'apps/api/src/testing/map-context-smoke.ts'
      - 'apps/api/src/app.ts'
      - 'apps/api/package.json'
      - 'packages/contracts/src/gis.ts'
      - 'packages/contracts/src/index.ts'
      - 'database/migrations/0012_gis_land_references.sql'
      - '.github/workflows/gis-check.yml'
  pull_request:
    paths:
      - 'apps/api/src/gis/**'
      - 'apps/api/src/routes/gis.ts'
      - 'apps/api/src/testing/gis-*.ts'
      - 'apps/api/src/testing/map-context-smoke.ts'
      - 'apps/api/src/app.ts'
      - 'apps/api/package.json'
      - 'packages/contracts/src/gis.ts'
      - 'packages/contracts/src/index.ts'
      - 'database/migrations/0012_gis_land_references.sql'
      - '.github/workflows/gis-check.yml'

permissions:
  contents: read

jobs:
  gis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_gis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build contracts and API
        run: |
          pnpm --filter @magina/contracts typecheck
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build

      - name: Offline GIS adapter smoke
        run: node apps/api/dist/testing/gis-adapter-smoke.js

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply migrations and seed GIS scope
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_gis -v ON_ERROR_STOP=1 -f "${migration}"
          done
          psql -h 127.0.0.1 -U postgres -d magina_gis -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO workspaces (id, name, type)
          VALUES ('11111111-1111-4111-8111-111111111111', 'GIS CI Workspace', 'family');

          INSERT INTO fields (
            id, workspace_id, client_operation_id, name, description, municipality, province,
            tree_count, crop, variety, water_regime, status
          ) VALUES (
            '55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111',
            '44444444-4444-4444-8444-444444444444',
            'Finca GIS CI', NULL, 'Bedmar', 'Jaén', 23, 'olivar', 'picual', 'secano', 'active'
          );
          SQL

      - name: PostGIS land reference smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_gis
          ALLOW_DEV_AUTH_HEADERS: 'true'
          AUTH_COOKIE_SECURE: 'false'
        run: node apps/api/dist/testing/gis-smoke.js

      - name: Unified finca map context smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_gis
          ALLOW_DEV_AUTH_HEADERS: 'true'
          AUTH_COOKIE_SECURE: 'false'
        run: node apps/api/dist/testing/map-context-smoke.js
