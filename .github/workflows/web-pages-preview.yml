name: Web Preview · GitHub Pages

on:
  push:
    branches:
      - "feat/web-magína-olivo"
    paths:
      - "web/**"
      - ".github/workflows/web-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-web-preview"
  cancel-in-progress: true

jobs:
  build:
    name: Build static preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      GITHUB_PAGES: "true"
      PAGES_BASE_PATH: "/magina-olivo-v20"
      SITE_URL: "https://izc05.github.io/magina-olivo-v20"
      ALLOW_INDEXING: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Add Pages no-Jekyll marker
        run: touch out/.nojekyll

      - name: Verify exported routes
        run: |
          test -f out/index.html
          test -f out/producto/index.html
          test -f out/beneficios/index.html
          test -f out/territorio/index.html
          test -f out/contacto/index.html
          test -f out/privacidad/index.html
          test -f out/terminos/index.html
          test -f out/aviso-legal/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          grep -q "Disallow: /" out/robots.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
