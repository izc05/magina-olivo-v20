name: Gate 3 Android Emulator Evidence

on:
  push:
    branches:
      - qa/gate3-emulator-evidence-v2
  pull_request:
    branches:
      - main
      - qa/gate3-android-validation-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate3-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Build and unit-test Gate 3 candidate
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDevDebugUnitTest assembleDevDebug assembleDevDebugAndroidTest 2>&1 | tee build-output.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build diagnostics"
            echo "### Compiler errors"
            echo '```'
            grep -E "^(e: |FAILURE: |Caused by: |\* What went wrong:|\* Exception is:)" build-output.log | head -200 || true
            echo '```'
            echo "### Tail of build output"
            echo '```'
            tail -150 build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          errors=$(grep -E "^(e: |FAILURE: |Caused by: |\* What went wrong:|\* Exception is:)" build-output.log | head -60)
          if [ -z "$errors" ]; then
            errors=$(tail -40 build-output.log)
          fi
          encoded=$(printf '%s' "$errors" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=Gradle build failure::${encoded}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Capture Gate 3 Android evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/gate3-emulator-evidence.sh

      - name: Upload Gate 3 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magina-olivo-gate3-emulator-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
