name: V20 environment contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.example'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/check-env-contract.mjs'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/environment-contract-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  environment-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify documented runtime environment
        run: node scripts/check-env-contract.mjs
