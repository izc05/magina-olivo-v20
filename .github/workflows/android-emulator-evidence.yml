name: Android Emulator Evidence

on:
  push:
    branches:
      - qa/android-emulator-evidence-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Build DEV app and instrumented test APKs
        run: gradle --no-daemon assembleDevDebug assembleDevDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run emulator QA and performance capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh .github/scripts/android-emulator-evidence.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
