name: V20 routes adventure check

on:
  pull_request:
    branches:
      - feat/v20-routes-explore
      - integrate/v20-beta-closure
    paths:
      - 'apps/api/src/routes/route-adventure.ts'
      - 'apps/api/src/routes/route-adventure-hub.ts'
      - 'apps/api/src/routes/route-adventure-rewards.ts'
      - 'apps/api/src/routes/route-activity.ts'
      - 'apps/api/src/routes/route-activity-insights.ts'
      - 'apps/api/src/routes/route-activity-achievements.ts'
      - 'apps/api/src/routes/admin-route-adventure.ts'
      - 'apps/api/src/routes/admin-route-adventure-bulk.ts'
      - 'apps/api/src/routes/admin-route-adventure-readiness.ts'
      - 'apps/api/src/routes/admin-route-adventure-candidates.ts'
      - 'apps/api/src/routes/admin-route-adventure-progression.ts'
      - 'apps/api/src/routes/route-device-export.ts'
      - 'apps/web/src/app/aventura/**'
      - 'apps/web/src/app/perfil/page.tsx'
      - 'apps/web/src/app/explorar/explore-public-client.tsx'
      - 'apps/web/src/app/admin/rutas/page.tsx'
      - 'apps/web/src/app/admin/rutas/aventuras/**'
      - 'apps/web/src/app/rutas/detalle/route-adventure-panel.tsx'
      - 'apps/web/src/app/rutas/detalle/route-detail-client.tsx'
      - 'apps/web/src/app/rutas/detalle/route-map.tsx'
      - 'apps/web/src/components/adventure-explorer-profile.tsx'
      - 'apps/web/src/components/recorded-activity-profile-card.tsx'
      - 'apps/web/src/components/activity-achievements-profile-card.tsx'
      - 'apps/web/src/components/adventure-rewards-profile-card.tsx'
      - 'apps/web/src/components/route-adventure-admin.tsx'
      - 'apps/web/src/components/route-adventure-candidates.tsx'
      - 'apps/web/src/components/route-adventure-progression-admin.tsx'
      - 'apps/web/src/components/route-content-admin.tsx'
      - 'apps/web/src/lib/public-routes-source.ts'
      - 'apps/web/src/lib/route-activity-source.ts'
      - 'apps/web/src/lib/route-activity-achievements-source.ts'
      - 'apps/web/src/lib/adventure-rewards-source.ts'
      - 'database/migrations/0084_routes_adventure.sql'
      - 'database/migrations/0085_route_activity_recording.sql'
      - 'docs/v20-routes-adventure-spec.md'
      - 'e2e/public-editorial.spec.ts'
      - '.github/workflows/routes-adventure-check.yml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adventure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_adventure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_adventure"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_adventure
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_PREVIEW_MODE: 'false'
      ALLOW_DEV_AUTH_HEADERS: 'true'
      AUTH_COOKIE_SECURE: 'false'
      BACKGROUND_JOBS_ENABLED: 'false'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration sequence
        run: pnpm check:migrations

      - name: Typecheck API and web
        run: |
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/web typecheck

      - name: Build API and web
        run: |
          pnpm --filter @magina/api build
          pnpm --filter @magina/web build

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply all migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_adventure -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Adventure persistence safety album journey and activity smoke
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d magina_adventure -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, primary_email, display_name, status)
          VALUES ('11111111-1111-4111-8111-111111111111', 'adventure-ci@example.invalid', 'Adventure CI', 'active')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO routes (id, slug, name, route_type, created_by, updated_by)
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            'aventura-ci',
            'Aventura CI',
            'hiking',
            '11111111-1111-4111-8111-111111111111',
            '11111111-1111-4111-8111-111111111111'
          );

          INSERT INTO route_points(id, route_id, name, kind, location, distance_m, description, sort_order)
          VALUES (
            '55555555-5555-4555-8555-555555555555',
            '22222222-2222-4222-8222-222222222222',
            'POI real CI', 'viewpoint', ST_SetSRID(ST_MakePoint(-3.5, 37.7), 4326),
            500, 'Punto real reutilizable por Aventura', 10
          );

          INSERT INTO route_adventures(route_id, enabled, title, progression_mode, created_by, updated_by)
          VALUES (
            '22222222-2222-4222-8222-222222222222', false, 'Modo Aventura CI', 'linear',
            '11111111-1111-4111-8111-111111111111',
            '11111111-1111-4111-8111-111111111111'
          );

          INSERT INTO route_adventure_checkpoints(
            id, route_id, route_point_id, title, kind, collection_category, rarity,
            location, distance_m, unlock_radius_m, points
          ) VALUES (
            '33333333-3333-4333-8333-333333333333',
            '22222222-2222-4222-8222-222222222222',
            '55555555-5555-4555-8555-555555555555',
            'Reto CI', 'landmark', 'heritage', 'rare',
            ST_SetSRID(ST_MakePoint(-3.5, 37.7), 4326),
            500, 80, 120
          );

          INSERT INTO route_adventure_runs(id, route_id, user_id)
          VALUES (
            '44444444-4444-4444-8444-444444444444',
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111'
          );

          INSERT INTO route_adventure_unlocks(
            run_id, checkpoint_id, awarded_points, distance_to_checkpoint_m
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333',
            120, 0
          );

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM route_adventure_runs r
              JOIN route_adventure_unlocks u ON u.run_id = r.id
              WHERE r.id = '44444444-4444-4444-8444-444444444444'
                AND u.checkpoint_id = '33333333-3333-4333-8333-333333333333'
                AND u.awarded_points = 120
            ) THEN
              RAISE EXCEPTION 'adventure persistence smoke failed';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM route_adventure_checkpoints
              WHERE id = '33333333-3333-4333-8333-333333333333'
                AND collection_category = 'heritage'
                AND rarity = 'rare'
            ) THEN
              RAISE EXCEPTION 'territorial album metadata was not persisted';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE indexname = 'route_adventure_checkpoints_album_idx'
            ) THEN
              RAISE EXCEPTION 'territorial album index missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'route_adventure_unlocks' AND column_name = 'observed_location'
            ) THEN
              RAISE EXCEPTION 'exact user GPS storage must not exist in game unlocks';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE indexname = 'route_adventure_checkpoints_route_point_unique_idx'
            ) THEN
              RAISE EXCEPTION 'POI checkpoint uniqueness index missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM route_adventures
              WHERE route_id = '22222222-2222-4222-8222-222222222222'
                AND progression_mode = 'linear'
            ) THEN
              RAISE EXCEPTION 'adventure progression mode was not persisted';
            END IF;
            BEGIN
              UPDATE route_adventures
              SET enabled = true
              WHERE route_id = '22222222-2222-4222-8222-222222222222';
              RAISE EXCEPTION 'publication guard did not reject an unready route';
            EXCEPTION
              WHEN check_violation THEN NULL;
            END;
          END $$;

          INSERT INTO route_tracks(
            id, route_id, version, geometry, geometry_type, original_format,
            source_name, validation_status, validated_by, validated_at
          ) VALUES (
            '66666666-6666-4666-8666-666666666666',
            '22222222-2222-4222-8222-222222222222', 1,
            ST_GeomFromText('LINESTRING(-3.5 37.7,-3.49 37.71)', 4326),
            'LineString', 'manual', 'Adventure CI validated track', 'validated',
            '11111111-1111-4111-8111-111111111111', now()
          );

          UPDATE routes
          SET track_status = 'validated', status = 'published', validation_status = 'editorial',
              distance_m = 5200, elevation_gain_m = 340, duration_minutes = 135,
              published_at = now(), last_verified_at = now()
          WHERE id = '22222222-2222-4222-8222-222222222222';

          UPDATE route_adventures
          SET enabled = true
          WHERE route_id = '22222222-2222-4222-8222-222222222222';

          UPDATE route_adventure_runs
          SET status = 'completed', completed_at = now(), score = 120
          WHERE id = '44444444-4444-4444-8444-444444444444';

          INSERT INTO route_adventure_runs(id, route_id, user_id, status, score, completed_at)
          VALUES (
            '88888888-8888-4888-8888-888888888888',
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'completed', 120, now()
          );

          INSERT INTO route_sponsorships(
            id, route_id, sponsor_name, headline, description, cta_label, cta_url,
            promo_code, placement, billing_model, status, disclosure, created_by, updated_by
          ) VALUES (
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            '22222222-2222-4222-8222-222222222222',
            'Comercio CI', 'Premio de aventura CI', 'Beneficio comercial de prueba',
            'Ver oferta', 'https://example.invalid/reward', 'MAGINA-CI',
            'collection', 'flat', 'active', 'Patrocinado',
            '11111111-1111-4111-8111-111111111111',
            '11111111-1111-4111-8111-111111111111'
          );

          DO $$
          DECLARE
            journey_distance BIGINT;
            journey_elevation BIGINT;
            journey_routes INTEGER;
            reward_count INTEGER;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM route_adventures
              WHERE route_id = '22222222-2222-4222-8222-222222222222' AND enabled = true
            ) THEN
              RAISE EXCEPTION 'ready adventure could not be enabled';
            END IF;

            WITH completed_routes AS (
              SELECT DISTINCT ar.route_id
              FROM route_adventure_runs ar
              WHERE ar.user_id = '11111111-1111-4111-8111-111111111111'::uuid
                AND ar.status = 'completed'
            )
            SELECT COUNT(*)::int, COALESCE(SUM(r.distance_m), 0), COALESCE(SUM(r.elevation_gain_m), 0)
            INTO journey_routes, journey_distance, journey_elevation
            FROM completed_routes cr
            JOIN routes r ON r.id = cr.route_id;

            IF journey_routes <> 1 OR journey_distance <> 5200 OR journey_elevation <> 340 THEN
              RAISE EXCEPTION 'journey metrics must count each completed route once: routes %, distance %, elevation %', journey_routes, journey_distance, journey_elevation;
            END IF;

            WITH completed_routes AS (
              SELECT route_id, MAX(completed_at) AS completed_at
              FROM route_adventure_runs
              WHERE user_id = '11111111-1111-4111-8111-111111111111'::uuid
                AND status = 'completed' AND completed_at IS NOT NULL
              GROUP BY route_id
            )
            SELECT COUNT(*)::int INTO reward_count
            FROM completed_routes cr
            JOIN route_sponsorships s ON s.route_id = cr.route_id
            WHERE s.placement = 'collection'
              AND s.status = 'active'
              AND (s.starts_at IS NULL OR s.starts_at <= now())
              AND (s.ends_at IS NULL OR s.ends_at > now());

            IF reward_count <> 1 THEN
              RAISE EXCEPTION 'completed adventure must unlock exactly one active collection sponsorship, got %', reward_count;
            END IF;
          END $$;

          INSERT INTO route_activity_sessions(
            id, user_id, route_id, status, distance_m, active_seconds, active_started_at
          ) VALUES (
            '99999999-9999-4999-8999-999999999999',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'active', 0, 0, now()
          );

          INSERT INTO route_activity_points(
            session_id, recorded_at, location, accuracy_m, altitude_m, segment_distance_m
          ) VALUES
            (
              '99999999-9999-4999-8999-999999999999', now() - interval '20 seconds',
              ST_SetSRID(ST_MakePoint(-3.5000, 37.7000), 4326), 12, 980, 0
            ),
            (
              '99999999-9999-4999-8999-999999999999', now() - interval '10 seconds',
              ST_SetSRID(ST_MakePoint(-3.4995, 37.7005), 4326), 12, 990, 70
            ),
            (
              '99999999-9999-4999-8999-999999999999', now(),
              ST_SetSRID(ST_MakePoint(-3.4990, 37.7010), 4326), 12, 1005, 70
            );

          UPDATE route_activity_sessions
          SET status = 'completed', active_started_at = NULL, ended_at = now(),
              distance_m = 1234, active_seconds = 600, point_count = 3
          WHERE id = '99999999-9999-4999-8999-999999999999';

          INSERT INTO route_activity_sessions(
            id, user_id, route_id, status, active_started_at
          ) VALUES (
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            'active', now()
          );

          DO $$
          DECLARE
            recorded_gain NUMERIC;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE indexname = 'route_activity_sessions_one_open_user_idx'
            ) THEN
              RAISE EXCEPTION 'single open activity index missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM route_activity_sessions
              WHERE id = '99999999-9999-4999-8999-999999999999'
                AND status = 'completed' AND distance_m = 1234 AND active_seconds = 600 AND point_count = 3
            ) THEN
              RAISE EXCEPTION 'completed activity metrics were not persisted';
            END IF;
            IF (SELECT COUNT(*) FROM route_activity_points WHERE session_id = '99999999-9999-4999-8999-999999999999') <> 3 THEN
              RAISE EXCEPTION 'opt-in private GPS samples were not persisted';
            END IF;

            WITH ordered AS (
              SELECT altitude_m::double precision AS altitude_m,
                     segment_distance_m::double precision AS segment_distance_m,
                     lag(altitude_m::double precision) OVER (ORDER BY recorded_at, id) AS previous_altitude_m
              FROM route_activity_points
              WHERE session_id = '99999999-9999-4999-8999-999999999999'
            )
            SELECT COALESCE(SUM(
              CASE
                WHEN segment_distance_m > 0
                  AND altitude_m IS NOT NULL
                  AND previous_altitude_m IS NOT NULL
                  AND altitude_m - previous_altitude_m BETWEEN 3 AND 80
                THEN altitude_m - previous_altitude_m
                ELSE 0
              END
            ), 0) INTO recorded_gain
            FROM ordered;

            IF recorded_gain <> 25 THEN
              RAISE EXCEPTION 'recorded activity elevation smoke expected 25m, got %', recorded_gain;
            END IF;

            BEGIN
              INSERT INTO route_activity_sessions(user_id, status, active_started_at)
              VALUES ('11111111-1111-4111-8111-111111111111', 'active', now());
              RAISE EXCEPTION 'parallel open activity was not rejected';
            EXCEPTION
              WHEN unique_violation THEN NULL;
            END;
          END $$;

          INSERT INTO route_condition_reports(
            id, route_id, user_id, condition_kind, severity, note, observed_at,
            expires_at, moderation_status, moderation_note, moderated_by, moderated_at
          ) VALUES (
            '77777777-7777-4777-8777-777777777777',
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'closed', 'critical', 'Cierre crítico moderado CI', now(), now() + interval '1 day',
            'approved', 'Safety hold CI', '11111111-1111-4111-8111-111111111111', now()
          );

          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM route_adventures
              WHERE route_id = '22222222-2222-4222-8222-222222222222' AND enabled = true
            ) THEN
              RAISE EXCEPTION 'critical moderated safety hold did not disable adventure';
            END IF;
            BEGIN
              UPDATE route_adventures
              SET enabled = true
              WHERE route_id = '22222222-2222-4222-8222-222222222222';
              RAISE EXCEPTION 'critical safety hold did not block reactivation';
            EXCEPTION
              WHEN check_violation THEN NULL;
            END;
          END $$;
          SQL