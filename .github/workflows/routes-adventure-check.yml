name: V20 routes adventure check

on:
  pull_request:
    branches:
      - feat/v20-routes-explore
      - integrate/v20-beta-closure
    paths:
      - 'apps/api/src/routes/route-adventure.ts'
      - 'apps/api/src/routes/route-adventure-hub.ts'
      - 'apps/api/src/routes/admin-route-adventure.ts'
      - 'apps/api/src/routes/admin-route-adventure-bulk.ts'
      - 'apps/api/src/routes/admin-route-adventure-readiness.ts'
      - 'apps/api/src/routes/admin-route-adventure-candidates.ts'
      - 'apps/api/src/routes/route-device-export.ts'
      - 'apps/web/src/app/aventura/**'
      - 'apps/web/src/app/explorar/explore-public-client.tsx'
      - 'apps/web/src/app/admin/rutas/page.tsx'
      - 'apps/web/src/app/admin/rutas/aventuras/**'
      - 'apps/web/src/app/rutas/detalle/route-adventure-panel.tsx'
      - 'apps/web/src/app/rutas/detalle/route-detail-client.tsx'
      - 'apps/web/src/app/rutas/detalle/route-map.tsx'
      - 'apps/web/src/components/route-adventure-admin.tsx'
      - 'apps/web/src/components/route-adventure-candidates.tsx'
      - 'apps/web/src/components/route-content-admin.tsx'
      - 'apps/web/src/lib/public-routes-source.ts'
      - 'database/migrations/0083_routes_adventure.sql'
      - 'docs/v20-routes-adventure-spec.md'
      - 'e2e/public-editorial.spec.ts'
      - '.github/workflows/routes-adventure-check.yml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adventure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_adventure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_adventure"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_adventure
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_PREVIEW_MODE: 'false'
      ALLOW_DEV_AUTH_HEADERS: 'true'
      AUTH_COOKIE_SECURE: 'false'
      BACKGROUND_JOBS_ENABLED: 'false'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration sequence
        run: pnpm check:migrations

      - name: Typecheck API and web
        run: |
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/web typecheck

      - name: Build API and web
        run: |
          pnpm --filter @magina/api build
          pnpm --filter @magina/web build

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply all migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_adventure -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Adventure persistence smoke
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d magina_adventure -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, primary_email, display_name, status)
          VALUES ('11111111-1111-4111-8111-111111111111', 'adventure-ci@example.invalid', 'Adventure CI', 'active')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO routes (id, slug, name, route_type, created_by, updated_by)
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            'aventura-ci',
            'Aventura CI',
            'hiking',
            '11111111-1111-4111-8111-111111111111',
            '11111111-1111-4111-8111-111111111111'
          );

          INSERT INTO route_points(id, route_id, name, kind, location, distance_m, description, sort_order)
          VALUES (
            '55555555-5555-4555-8555-555555555555',
            '22222222-2222-4222-8222-222222222222',
            'POI real CI', 'viewpoint', ST_SetSRID(ST_MakePoint(-3.5, 37.7), 4326),
            500, 'Punto real reutilizable por Aventura', 10
          );

          INSERT INTO route_adventures(route_id, enabled, title, created_by, updated_by)
          VALUES (
            '22222222-2222-4222-8222-222222222222', false, 'Modo Aventura CI',
            '11111111-1111-4111-8111-111111111111',
            '11111111-1111-4111-8111-111111111111'
          );

          INSERT INTO route_adventure_checkpoints(
            id, route_id, route_point_id, title, kind, location, distance_m, unlock_radius_m, points
          ) VALUES (
            '33333333-3333-4333-8333-333333333333',
            '22222222-2222-4222-8222-222222222222',
            '55555555-5555-4555-8555-555555555555',
            'Reto CI', 'landmark', ST_SetSRID(ST_MakePoint(-3.5, 37.7), 4326),
            500, 80, 120
          );

          INSERT INTO route_adventure_runs(id, route_id, user_id)
          VALUES (
            '44444444-4444-4444-8444-444444444444',
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111'
          );

          INSERT INTO route_adventure_unlocks(
            run_id, checkpoint_id, awarded_points, distance_to_checkpoint_m
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333',
            120, 0
          );

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM route_adventure_runs r
              JOIN route_adventure_unlocks u ON u.run_id = r.id
              WHERE r.id = '44444444-4444-4444-8444-444444444444'
                AND u.checkpoint_id = '33333333-3333-4333-8333-333333333333'
                AND u.awarded_points = 120
            ) THEN
              RAISE EXCEPTION 'adventure persistence smoke failed';
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'route_adventure_unlocks' AND column_name = 'observed_location'
            ) THEN
              RAISE EXCEPTION 'exact user GPS storage must not exist';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE indexname = 'route_adventure_checkpoints_route_point_unique_idx'
            ) THEN
              RAISE EXCEPTION 'POI checkpoint uniqueness index missing';
            END IF;
            BEGIN
              UPDATE route_adventures
              SET enabled = true
              WHERE route_id = '22222222-2222-4222-8222-222222222222';
              RAISE EXCEPTION 'publication guard did not reject an unready route';
            EXCEPTION
              WHEN check_violation THEN NULL;
            END;
          END $$;
          SQL
