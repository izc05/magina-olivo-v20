name: V20 Mi Olivo check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/routes/mi-olivo.ts'
      - 'apps/api/src/routes/mi-olivo-campaign.ts'
      - 'apps/api/src/testing/mi-olivo-smoke.ts'
      - 'apps/api/src/testing/mi-olivo-campaign-smoke.ts'
      - 'apps/api/src/app.ts'
      - 'apps/web/src/app/mi-olivo/**'
      - 'apps/web/src/components/mi-olivo-dashboard.tsx'
      - 'apps/web/src/components/mi-olivo-dashboard.module.css'
      - 'apps/web/src/components/mi-olivo-campaign-controller.tsx'
      - 'apps/web/src/components/mi-olivo-campaign-controller.module.css'
      - 'apps/web/src/components/mi-olivo-weather-controller.tsx'
      - 'apps/web/src/components/mi-olivo-weather-controller.module.css'
      - 'database/migrations/0050_mi_olivo_core.sql'
      - 'database/migrations/0051_mi_olivo_v2_source_validation.sql'
      - 'database/migrations/0052_mi_olivo_appearance.sql'
      - '.nvmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mi-olivo-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mi-olivo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_mi_olivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_mi_olivo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API and web
        run: |
          pnpm --filter @magina/contracts typecheck
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather typecheck
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build
          pnpm --filter @magina/web typecheck
          pnpm --filter @magina/web build
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_mi_olivo -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Mi Olivo ledger + idempotency smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_mi_olivo
          ALLOW_DEV_AUTH_HEADERS: 'false'
          AUTH_COOKIE_SECURE: 'false'
        run: node apps/api/dist/testing/mi-olivo-smoke.js
      - name: Mi Olivo campaign + appearance smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_mi_olivo
          ALLOW_DEV_AUTH_HEADERS: 'false'
          AUTH_COOKIE_SECURE: 'false'
        run: node apps/api/dist/testing/mi-olivo-campaign-smoke.js
