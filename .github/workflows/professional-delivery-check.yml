name: V20 professional delivery check

on:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'database/migrations/0039_professional_delivery_tracking.sql'
      - 'database/migrations/0040_professional_public_share_links.sql'
      - 'database/migrations/0041_public_quote_decision_audit.sql'
      - '.github/workflows/professional-delivery-check.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'database/migrations/0039_professional_delivery_tracking.sql'
      - 'database/migrations/0040_professional_public_share_links.sql'
      - 'database/migrations/0041_public_quote_decision_audit.sql'
      - '.github/workflows/professional-delivery-check.yml'

permissions:
  contents: read

jobs:
  professional-delivery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @magina/contracts typecheck
      - run: pnpm --filter @magina/contracts build
      - run: pnpm --filter @magina/api typecheck
      - run: pnpm --filter @magina/api build
      - run: pnpm --filter @magina/web typecheck
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          for migration in database/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d magina -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Professional delivery smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina
          ALLOW_DEV_AUTH_HEADERS: 'true'
        run: node apps/api/dist/testing/professional-delivery-smoke.js
      - run: pnpm --filter @magina/web build
