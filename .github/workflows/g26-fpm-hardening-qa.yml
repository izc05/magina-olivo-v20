name: G2.6 fpm_manage hardening QA isolated

on:
  pull_request:
    branches: [codex/g26-parcel-send]
  workflow_dispatch:

permissions:
  contents: read

# Regression jobs run the existing suites WITH the hardening appended to their own schema.
env:
  MAGINA_EXTRA_PROPOSALS: g26-fpm-manage-hardening.sql

jobs:
  hardening-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: Failure diagnostics never print secrets
        run: bash supabase/tests/lib/diagnostics.test.sh
      - name: Before/after direct-write proof and inventory on disposable Supabase
        # The contract applies the hardening itself, after proving the legacy baseline.
        env:
          MAGINA_EXTRA_PROPOSALS: ''
        run: bash supabase/tests/g26-fpm-hardening/run.sh

  g0-native-hardened:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        baseline: [clean, legacy]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: G0 native Auth, PostgREST, RLS and Storage with the hardening
        env:
          G0_NATIVE_BASELINE: ${{ matrix.baseline }}
        run: bash .github/scripts/test-g0-native-supabase.sh

  g1c-g2-native-hardened:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: G1c native reservation with the hardening
        run: bash supabase/tests/g1c-native/run.sh
      - name: G2 native own-data sync with the hardening
        run: bash supabase/tests/g2-native/run.sh
      - name: Combined G0 hardening, G1c and G2 with the hardening
        run: bash supabase/tests/combined-native/run.sh

  g26-sql-hardened:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: '#797 to #800 SQL contracts with the hardening'
        run: |
          bash supabase/tests/g26-parent-receive/run.sh
          bash supabase/tests/g26-workspace-send/run.sh
          bash supabase/tests/g26-farm-send/run.sh
          bash supabase/tests/g26-parcel-send/run.sh

  g26-android-hardened:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: '#800, #799, #798 then #797 real HTTPS probes with the hardening, on one disposable API 35'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash supabase/tests/g26-parcel-send-android/run.sh && bash supabase/tests/g26-farm-send-android/run.sh && bash supabase/tests/g26-workspace-send-android/run.sh && bash supabase/tests/g26-parent-receive-android/run.sh
