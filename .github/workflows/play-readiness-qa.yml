name: Play 1.0 readiness QA

on:
  pull_request:
    branches: [codex/g26-808-integration-796]

permissions:
  contents: read

jobs:
  release-and-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Unit tests and production variant compilation
        run: gradle --no-daemon --max-workers=1 --no-parallel testDevDebugUnitTest assembleProductionDebug assembleDevDebug assembleDevDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Account restart and offline access on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/dev/debug/app-dev-debug.apk
            adb install -r app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.isivoltpro.maginaolivo.AccountAuthGateTest com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/play-offline.txt
            grep -q 'INSTRUMENTATION_CODE: -1' /tmp/play-offline.txt
            grep -Eq 'OK \([0-9]+ tests\)' /tmp/play-offline.txt
