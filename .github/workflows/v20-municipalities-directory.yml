name: V20 municipalities directory

on:
  pull_request:
    paths:
      - 'database/migrations/0061_municipalities_directory.sql'
      - 'apps/api/src/routes/territory.ts'
      - 'apps/api/src/routes/admin-territory.ts'
      - 'apps/web/src/app/ayuntamientos/**'
      - 'apps/web/src/app/admin/ayuntamientos/**'
      - 'apps/web/src/app/explorar/explore-public-client.tsx'
      - 'apps/web/src/lib/public-territory-source.ts'
      - 'scripts/check-municipalities-directory.mjs'
      - '.github/workflows/v20-municipalities-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  municipalities-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - name: Directory contract
        run: node scripts/check-municipalities-directory.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
