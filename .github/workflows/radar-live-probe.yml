name: V20 one-shot AEMET radar live probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - '.github/workflows/radar-live-probe.yml'
      - 'packages/weather/src/testing/radar-live-inventory.ts'
      - 'packages/weather/src/testing/radar-live-probe.ts'
      - 'packages/weather/src/aemet-radar-geotiff.ts'
      - 'packages/weather/src/radar-geotiff-inspection.ts'
      - 'packages/weather/src/radar-escala.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts and weather
        run: |
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather typecheck
          pnpm --filter @magina/weather build

      - name: Inventory current public AEMET radar bundle
        run: node packages/weather/dist/testing/radar-live-inventory.js

      - name: Probe latest selected AEMET reflectivity metadata
        run: node packages/weather/dist/testing/radar-live-probe.js
