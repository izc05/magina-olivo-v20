name: Deploy oil-market function

# Phase 20D-2: reads the live Junta page from this runner first (the repository's fixtures are
# synthetic markup around the owner's verified values), refuses to deploy if the parser does not
# understand it, then deploys `oil-market` with JWT verification ON (no --no-verify-jwt) and makes
# ONE real call. The live page and both responses are kept as the validation artifact. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oil-market-function
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: zzelvbcuxsboafibfxch
      FUNCTIONS_URL: https://zzelvbcuxsboafibfxch.supabase.co/functions/v1
      JUNTA_URL: https://www.juntadeandalucia.es/agriculturaypesca/observatorio/servlet/FrontController?action=UltimosPrecios&posicion=2291332&producto=33000&subsector=33
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fixture tests before deploying
        run: node --experimental-strip-types --test supabase/functions/*/*.test.ts

      - name: Read the live Junta page with the function's parser
        run: |
          mkdir -p evidence
          curl -sS -L -m 30 "$JUNTA_URL" -o evidence/junta-ultimos-precios.live.html -w "%{http_code}\n" | tee evidence/junta-page.status
          {
            echo "## Live Junta page — what oil-market reads"
            echo '```'
            node --experimental-strip-types supabase/functions/oil-market/check-live.ts evidence/junta-ultimos-precios.live.html 2>&1 | tee evidence/junta-parsed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -s evidence/junta-parsed.txt && ! grep -q "Error" evidence/junta-parsed.txt

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_FULL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a secret key"; exit 1;; esac

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy (verify_jwt stays on)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_FULL }}
        run: supabase functions deploy oil-market --project-ref "$PROJECT_REF"

      - name: Real call — Andalucía, 12 weeks
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body='{"operation":"series","geography":"andalucia","weeks":12}'
          status=$(curl -sS -m 30 -X POST "$FUNCTIONS_URL/oil-market" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d "$body" -o evidence/oil-market-andalucia.json -w "%{http_code}")
          # JWT verification proof: the same call without the key must be refused.
          unauth=$(curl -sS -m 30 -X POST "$FUNCTIONS_URL/oil-market" -H "Content-Type: application/json" \
            -d "$body" -o /dev/null -w "%{http_code}")
          {
            echo "## oil-market — real validation"
            echo "- oil-market (andalucia, 12 weeks): HTTP $status"
            echo "- without key: HTTP $unauth (must be 401)"
            echo '```json'
            cat evidence/oil-market-andalucia.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = "200" && test "$unauth" = "401"

      - name: Keep the live page and the responses
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oil-market-validation
          path: evidence/
          retention-days: 30
