name: Deploy oil-market function

# Phase 20D-2: deploys `oil-market` with JWT verification ON (no --no-verify-jwt) and makes ONE
# real call from Supabase's Paris region (x-region: eu-west-3), which is how a phone in Spain
# reaches it. The real call is the gate: the job is red unless the function read the live Junta
# page. The app keeps the source switched off until then, so a deployed-but-unreadable function
# shows nothing new to farmers. Before deploying, this runner also tries to read the page itself
# (informative only: run #1 showed GitHub's runners cannot connect to juntadeandalucia.es).
# The live page (when reachable) and the responses are kept as the validation artifact. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oil-market-function
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: zzelvbcuxsboafibfxch
      FUNCTIONS_URL: https://zzelvbcuxsboafibfxch.supabase.co/functions/v1
      JUNTA_URL: https://www.juntadeandalucia.es/agriculturaypesca/observatorio/servlet/FrontController?action=UltimosPrecios&posicion=2291332&producto=33000&subsector=33
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fixture tests before deploying
        run: node --experimental-strip-types --test supabase/functions/*/*.test.ts

      - name: Try the live Junta page from this runner (informative)
        continue-on-error: true
        run: |
          mkdir -p evidence
          status=$(curl -sS -L -m 45 "$JUNTA_URL" -o evidence/junta-ultimos-precios.live.html -w "%{http_code}" || true)
          {
            echo "## Live Junta page from the GitHub runner (informative)"
            echo "- HTTP: $status"
            echo '```'
            if [ -s evidence/junta-ultimos-precios.live.html ]; then
              node --experimental-strip-types supabase/functions/oil-market/check-live.ts evidence/junta-ultimos-precios.live.html 2>&1 | tail -30 || true
            else
              echo "page not downloaded"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_FULL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY secret is missing"; exit 1; }
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a secret key"; exit 1;; esac

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy (verify_jwt stays on)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_FULL }}
        run: supabase functions deploy oil-market --project-ref "$PROJECT_REF"

      - name: Real call from Supabase (Paris region) — Andalucía, 12 weeks
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body='{"operation":"series","geography":"andalucia","weeks":12}'
          mkdir -p evidence
          status=$(curl -sS -m 60 -X POST "$FUNCTIONS_URL/oil-market" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "x-region: eu-west-3" \
            -H "Content-Type: application/json" -d "$body" -o evidence/oil-market-andalucia.json -w "%{http_code}")
          # JWT verification proof: the same call without the key must be refused.
          unauth=$(curl -sS -m 30 -X POST "$FUNCTIONS_URL/oil-market" -H "Content-Type: application/json" \
            -d "$body" -o /dev/null -w "%{http_code}")
          {
            echo "## oil-market — real validation"
            echo "- oil-market (andalucia, 12 weeks, region eu-west-3): HTTP $status"
            echo "- 502 source_unavailable = the function could not reach the Junta (detail says how);"
            echo "  502 source_unreadable = it reached it but the page is not the table we expect."
            echo "- without key: HTTP $unauth (must be 401)"
            echo '```json'
            cat evidence/oil-market-andalucia.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = "200" && test "$unauth" = "401"

      - name: Keep the live page and the responses
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oil-market-validation
          path: evidence/
          retention-days: 30
