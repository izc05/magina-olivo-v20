name: V20 foundation check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.example'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'apps/**/package.json'
      - 'apps/web/tsconfig.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Audit CI modernization and permissions
        run: node scripts/audit-ci.mjs --strict

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify environment contract
        run: pnpm check:env

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Verify build leaves tracked files unchanged
        run: |
          if ! git diff --exit-code; then
            echo 'Build modified tracked repository files. Commit the generated/configuration change instead of mutating it in CI.' >&2
            exit 1
          fi
