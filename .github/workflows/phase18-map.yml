name: Phase 18 offline parcel map

on:
  workflow_dispatch:
  push:
    branches: ["codex/phase18-map-v2"]
    paths:
      - "app/**"
      - ".github/workflows/phase18-map.yml"

permissions:
  contents: read

jobs:
  live-import-offline-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Build application and Phase 18 tests
        run: gradle --no-daemon testDevDebugUnitTest assembleDevDebug assembleDevDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Import online, restart, render local geometry offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p evidence
            adb install -r -t "$(find app/build/outputs/apk/dev/debug -name '*.apk' | head -n 1)"
            adb install -r -t "$(find app/build/outputs/apk/androidTest -name '*.apk' | head -n 1)"
            adb shell am instrument -w -e class com.isivoltpro.maginaolivo.Phase18OnlineImportTest com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/phase18-online.txt
            grep -q 'OK (1 test)' evidence/phase18-online.txt
            adb shell am instrument -w -e class com.isivoltpro.maginaolivo.Phase18PolygonParcelLookupTest com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/phase18-polygon-parcel.txt
            grep -q 'OK (1 test)' evidence/phase18-polygon-parcel.txt
            adb shell am force-stop com.isivoltpro.maginaolivo.dev
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -e class com.isivoltpro.maginaolivo.Phase18OfflineReopenTest com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/phase18-offline.txt
            adb pull /sdcard/Android/data/com.isivoltpro.maginaolivo.dev/files/phase18-offline-map.png evidence/phase18-offline-map.png
            test -s evidence/phase18-offline-map.png
            grep -q 'OK (1 test)' evidence/phase18-offline.txt
      - name: Upload Gate 18 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase18-offline-map-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
