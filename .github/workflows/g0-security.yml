name: G0 security DEV

on:
  pull_request:
    paths: ['supabase/proposals/**', 'supabase/migrations/**', 'supabase/tests/**', 'supabase/package*.json', '.github/scripts/test-g0-native-supabase.sh', '.github/workflows/g0-security.yml']
  push:
    branches: ['feat/g0-auth-sync-contracts']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci --prefix supabase
      - run: npm test --prefix supabase

  native-auth-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        baseline: [clean, legacy]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: Native Auth, PostgREST, RLS, Storage, migration and backup DEV
        env:
          G0_NATIVE_BASELINE: ${{ matrix.baseline }}
        run: bash .github/scripts/test-g0-native-supabase.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g0-native-${{ matrix.baseline }}
          path: evidence/g0-native/
          retention-days: 14

  g1c-native-reservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: Test proposal only inside a fresh disposable native stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/g1c-native
          supabase --version > evidence/g1c-native/cli-version.txt
          bash supabase/tests/g1c-native/run.sh 2>&1 | tee evidence/g1c-native/tests.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g1c-native-reservation
          path: evidence/g1c-native/
          retention-days: 14

  g2-native-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: Test G2.1 own-data sync proposal inside a fresh disposable native stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/g2-native
          supabase --version > evidence/g2-native/cli-version.txt
          bash supabase/tests/g2-native/run.sh 2>&1 | tee evidence/g2-native/tests.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g2-native-sync
          path: evidence/g2-native/
          retention-days: 14

  combined-native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.120.0'
      - name: Test pinned G0 hardening, G1c and G2.1 in one disposable native stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/combined-native
          supabase --version > evidence/combined-native/cli-version.txt
          bash supabase/tests/combined-native/run.sh 2>&1 | tee evidence/combined-native/tests.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: combined-native-integration
          path: evidence/combined-native/
          retention-days: 14
