name: Mágina Olivo 1.0 integrated DEV APK

on:
  pull_request:
    branches: [codex/g26-808-manual-sync, feat/integration-1-0-dev-apk]

permissions:
  contents: read

jobs:
  integrated-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Verify integrated runner controls (fake adb)
        run: bash .github/scripts/test-integration-dev-instrumentation.sh
      - name: Build integrated DEV APK and tests
        run: gradle --no-daemon --max-workers=1 --no-parallel testDevDebugUnitTest assembleDevDebug assembleDevDebugAndroidTest
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/dev/debug/app-dev-debug.apk > app/build/outputs/apk/dev/debug/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: magina-olivo-1-0-integrada-dev
          path: |
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Account, Room, navigation, weather and sync on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: GATE3_ALLOW_APP_DATA_RESET=1 bash .github/scripts/integration-dev-instrumentation.sh
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-1-0-test-log
          path: |
            integration-tests.txt
            navigation-evidence/
            account-auth-evidence/
            integration-device-evidence/
          if-no-files-found: ignore
