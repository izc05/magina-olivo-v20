name: Mágina Olivo 1.0 integrated DEV APK

on:
  pull_request:
    branches: [codex/g26-808-manual-sync]

permissions:
  contents: read

jobs:
  integrated-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
      - name: Build integrated DEV APK and tests
        run: gradle --no-daemon --max-workers=1 --no-parallel testDevDebugUnitTest assembleDevDebug assembleDevDebugAndroidTest
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/dev/debug/app-dev-debug.apk > app/build/outputs/apk/dev/debug/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: magina-olivo-1-0-integrada-dev
          path: |
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Account, Room, navigation, weather and sync on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            trap 'adb pull /sdcard/Android/data/com.isivoltpro.maginaolivo.dev/files/navigation-evidence navigation-evidence >/dev/null 2>&1 || true' EXIT
            adb install -r app/build/outputs/apk/dev/debug/app-dev-debug.apk
            adb install -r app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.isivoltpro.maginaolivo.AccountAuthGateTest,com.isivoltpro.maginaolivo.FarmLinkScreenTest,com.isivoltpro.maginaolivo.AppNavigationTest,com.isivoltpro.maginaolivo.HomeFeedsScreenTest,com.isivoltpro.maginaolivo.WeatherWeekScreenTest,com.isivoltpro.maginaolivo.data.local.RoomMigrationTest,com.isivoltpro.maginaolivo.data.local.WorkspaceSelectionRoomTest,com.isivoltpro.maginaolivo.data.local.WorkspaceSendRoomTest,com.isivoltpro.maginaolivo.data.local.CampaignCreateSendRoomTest com.isivoltpro.maginaolivo.dev.test/androidx.test.runner.AndroidJUnitRunner | tee integration-tests.txt
            grep -q 'INSTRUMENTATION_CODE: -1' integration-tests.txt
            grep -Eq 'OK \([0-9]+ tests\)' integration-tests.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-1-0-test-log
          path: |
            integration-tests.txt
            navigation-evidence/
          if-no-files-found: ignore
