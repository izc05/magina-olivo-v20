name: V20 full candidate check

on:
  push:
    branches:
      - feat/v20-visual-prototype
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'database/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/visual-prototype-check.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Contracts typecheck
        run: pnpm --filter @magina/contracts typecheck

      - name: Build contracts
        run: pnpm --filter @magina/contracts build

      - name: API typecheck
        run: pnpm --filter @magina/api typecheck

      - name: API build
        run: pnpm --filter @magina/api build

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: API database smoke test
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina
        run: |
          psql -h 127.0.0.1 -U postgres -d magina -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO workspaces (id, name, type)
          VALUES ('11111111-1111-4111-8111-111111111111', 'CI Workspace', 'family');
          INSERT INTO campaigns (id, workspace_id, name, start_date, status)
          VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', '2026/27', '2026-09-01', 'active');
          SQL

          node apps/api/dist/server.js >/tmp/magina-api.log 2>&1 &
          API_PID=$!
          trap 'kill ${API_PID} || true; cat /tmp/magina-api.log' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health

          FIELD_PAYLOAD='{"client_operation_id":"44444444-4444-4444-8444-444444444444","entity_id":"55555555-5555-4555-8555-555555555555","name":"Finca CI","tree_count":23,"water_regime":"secano"}'
          curl -fsS -X POST http://127.0.0.1:3001/api/v1/fields \
            -H 'content-type: application/json' \
            -H 'x-workspace-id: 11111111-1111-4111-8111-111111111111' \
            -H 'x-user-id: 33333333-3333-4333-8333-333333333333' \
            -d "${FIELD_PAYLOAD}"

          IRRIGATION_PAYLOAD='{"client_operation_id":"66666666-6666-4666-8666-666666666666","entity_id":"77777777-7777-4777-8777-777777777777","occurred_at":"2026-09-09T10:00:00+02:00","duration_hours":2,"cost_eur":22,"follow_up":{"scheduled_at":"2026-09-14T08:00:00+02:00"}}'
          for attempt in 1 2; do
            curl -fsS -X POST http://127.0.0.1:3001/api/v1/fields/55555555-5555-4555-8555-555555555555/irrigations \
              -H 'content-type: application/json' \
              -H 'x-workspace-id: 11111111-1111-4111-8111-111111111111' \
              -H 'x-user-id: 33333333-3333-4333-8333-333333333333' \
              -d "${IRRIGATION_PAYLOAD}"
          done

          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM irrigation_records WHERE id='77777777-7777-4777-8777-777777777777'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM cost_ledger_projection WHERE domain_record_id='77777777-7777-4777-8777-777777777777'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM farm_timeline_projection WHERE domain_record_id='77777777-7777-4777-8777-777777777777'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM scheduled_events WHERE source_domain_record_id='77777777-7777-4777-8777-777777777777'")" = "1"

          curl -fsS -X POST http://127.0.0.1:3001/api/v1/deliveries \
            -H 'content-type: application/json' \
            -H 'x-workspace-id: 11111111-1111-4111-8111-111111111111' \
            -H 'x-user-id: 33333333-3333-4333-8333-333333333333' \
            -d '{"client_operation_id":"88888888-8888-4888-8888-888888888888","entity_id":"99999999-9999-4999-8999-999999999999","campaign_id":"22222222-2222-4222-8222-222222222222","cooperative_or_mill":"SCA CI","delivery_at":"2026-12-12T09:30:00+01:00","ticket_number":"CI-001","total_kg":1842,"source":"ocr","fields":[{"field_id":"55555555-5555-4555-8555-555555555555"}]}'

          curl -fsS -X POST http://127.0.0.1:3001/api/v1/deliveries/99999999-9999-4999-8999-999999999999/results \
            -H 'content-type: application/json' \
            -H 'x-workspace-id: 11111111-1111-4111-8111-111111111111' \
            -H 'x-user-id: 33333333-3333-4333-8333-333333333333' \
            -d '{"client_operation_id":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","entity_id":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb","result_date":"2026-12-15","yield_percent":21.4}'

          SUMMARY=$(curl -fsS 'http://127.0.0.1:3001/api/v1/fields/55555555-5555-4555-8555-555555555555/harvest-summary?campaignId=22222222-2222-4222-8222-222222222222' \
            -H 'x-workspace-id: 11111111-1111-4111-8111-111111111111' \
            -H 'x-user-id: 33333333-3333-4333-8333-333333333333')
          SUMMARY="${SUMMARY}" node <<'NODE'
          const summary = JSON.parse(process.env.SUMMARY);
          if (Math.abs(summary.total_kg - 1842) > 0.001) throw new Error(`Unexpected total kg: ${summary.total_kg}`);
          if (Math.abs(summary.weighted_yield_percent - 21.4) > 0.001) throw new Error(`Unexpected weighted yield: ${summary.weighted_yield_percent}`);
          if (summary.pending_results !== 0) throw new Error(`Unexpected pending results: ${summary.pending_results}`);
          NODE

          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM harvest_deliveries WHERE id='99999999-9999-4999-8999-999999999999'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM delivery_results WHERE id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb' AND status='confirmed'")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d magina -Atc "SELECT count(*) FROM farm_timeline_projection WHERE field_id='55555555-5555-4555-8555-555555555555' AND domain_type IN ('harvest_delivery','harvest_result')")" = "2"

      - name: Web typecheck
        run: pnpm --filter @magina/web typecheck

      - name: Web build
        run: pnpm --filter @magina/web build
