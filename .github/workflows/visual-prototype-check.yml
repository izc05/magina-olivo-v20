name: V20 full candidate check

on:
  push:
    branches:
      - feat/v20-visual-prototype
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'database/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/visual-prototype-check.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Contracts typecheck
        run: pnpm --filter @magina/contracts typecheck

      - name: Build contracts
        run: pnpm --filter @magina/contracts build

      - name: API typecheck
        run: pnpm --filter @magina/api typecheck

      - name: API build
        run: pnpm --filter @magina/api build

      - name: Web typecheck
        run: pnpm --filter @magina/web typecheck

      - name: Web build
        run: pnpm --filter @magina/web build
