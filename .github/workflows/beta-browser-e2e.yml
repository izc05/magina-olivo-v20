          SQL

      - name: Run farmer browser journey
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina
          ALLOW_DEV_AUTH_HEADERS: 'true'
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_PREVIEW_MODE: 'false'
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_WORKSPACE_ID: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
          E2E_USER_ID: bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb
          RADAR_STALE_AFTER_MINUTES: '30'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: magina-e2e
          S3_ACCESS_KEY_ID: magina-e2e
          S3_SECRET_ACCESS_KEY: magina-e2e-secret
          S3_REGION: us-east-1
          S3_FORCE_PATH_STYLE: 'true'
        run: |
          node e2e/s3-fixture-server.mjs >/tmp/magina-s3-e2e.log 2>&1 &
          STORAGE_PID=$!
          node apps/api/dist/server.js >/tmp/magina-api-e2e.log 2>&1 &
          API_PID=$!
          pnpm --filter @magina/web start --hostname 127.0.0.1 --port 3000 >/tmp/magina-web-e2e.log 2>&1 &
          WEB_PID=$!
          trap 'kill ${API_PID} ${WEB_PID} ${STORAGE_PID} 2>/dev/null || true; echo "--- S3 FIXTURE LOG ---"; cat /tmp/magina-s3-e2e.log; echo "--- API LOG ---"; cat /tmp/magina-api-e2e.log; echo "--- WEB LOG ---"; cat /tmp/magina-web-e2e.log' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/__health >/dev/null && curl -fsS http://127.0.0.1:3001/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:9000/__health
          curl -fsS http://127.0.0.1:3001/health
          curl -fsS http://127.0.0.1:3000/ >/dev/null

          curl -fsS -D /tmp/private-headers.txt -o /dev/null \
            -H 'x-workspace-id: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa' \
            -H 'x-user-id: bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb' \
            http://127.0.0.1:3001/api/v1/me
          grep -Eiq '^cache-control: no-store' /tmp/private-headers.txt
          grep -Eiq '^x-content-type-options: nosniff' /tmp/private-headers.txt
          grep -Eiq '^x-frame-options: DENY' /tmp/private-headers.txt

          pnpm e2e:beta

      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-browser-e2e-debug
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
