name: V20 agronomy radar advisory check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'packages/weather/src/agronomy-*.ts'
      - 'packages/contracts/src/jobs.ts'
      - 'packages/jobs/src/index.ts'
      - 'apps/api/src/domain/agronomy-*.ts'
      - 'apps/api/src/routes/agronomy*.ts'
      - 'apps/api/src/routes/agenda.ts'
      - 'apps/api/src/testing/agronomy-radar-smoke.ts'
      - 'apps/worker/src/notifications/agronomy-evaluate.ts'
      - 'apps/worker/src/notifications/dispatch.ts'
      - 'apps/worker/src/server.ts'
      - 'apps/web/src/lib/agronomy-data-source.ts'
      - 'apps/web/src/components/today-agenda-client.tsx'
      - '.github/workflows/agronomy-radar-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agronomy-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @magina/contracts build

      - name: Weather typecheck
        run: pnpm --filter @magina/weather typecheck

      - name: Build weather
        run: pnpm --filter @magina/weather build

      - name: Jobs typecheck
        run: pnpm --filter @magina/jobs typecheck

      - name: Build jobs
        run: pnpm --filter @magina/jobs build

      - name: API typecheck
        run: pnpm --filter @magina/api typecheck

      - name: API build
        run: pnpm --filter @magina/api build

      - name: Worker typecheck
        run: pnpm --filter @magina/worker typecheck

      - name: Worker build
        run: pnpm --filter @magina/worker build

      - name: Agronomy radar smoke
        run: node apps/api/dist/testing/agronomy-radar-smoke.js

      - name: Web typecheck
        run: pnpm --filter @magina/web typecheck
