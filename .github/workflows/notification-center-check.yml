name: V20 notification center check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/app.ts'
      - 'apps/api/src/routes/notification-center.ts'
      - 'apps/api/src/testing/notification-center-smoke.ts'
      - 'apps/web/src/app/mi-campo/avisos/**'
      - 'apps/web/src/components/notification-center-client.tsx'
      - 'apps/web/src/components/topbar.tsx'
      - 'apps/web/src/lib/notification-center-data-source.ts'
      - 'e2e/notification-center.spec.ts'
      - '.github/workflows/notification-center-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notification-center:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_notifications
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_notifications"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build API
        run: |
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/weather build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build

      - name: Typecheck and build web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: notification-center-ci.apps.googleusercontent.com
          NEXT_PUBLIC_PREVIEW_MODE: 'false'
        run: |
          pnpm --filter @magina/web typecheck
          pnpm --filter @magina/web build

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d magina_notifications -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done

      - name: Notification history isolation smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_notifications
          ALLOW_DEV_AUTH_HEADERS: 'true'
        run: node apps/api/dist/testing/notification-center-smoke.js
