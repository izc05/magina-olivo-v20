name: V20 auth and memberships check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/src/auth/**'
      - 'apps/api/src/routes/auth.ts'
      - 'apps/api/src/request-context.ts'
      - 'apps/api/src/http/helpers.ts'
      - 'apps/api/src/testing/auth-smoke.ts'
      - 'apps/api/src/db/types.ts'
      - 'apps/api/package.json'
      - 'packages/contracts/src/auth.ts'
      - 'packages/contracts/src/index.ts'
      - 'database/migrations/0010_auth_memberships.sql'
      - '.github/workflows/auth-check.yml'
  pull_request:
    paths:
      - 'apps/api/src/auth/**'
      - 'apps/api/src/routes/auth.ts'
      - 'apps/api/src/request-context.ts'
      - 'apps/api/src/http/helpers.ts'
      - 'apps/api/src/testing/auth-smoke.ts'
      - 'apps/api/src/db/types.ts'
      - 'apps/api/package.json'
      - 'packages/contracts/src/auth.ts'
      - 'packages/contracts/src/index.ts'
      - 'database/migrations/0010_auth_memberships.sql'
      - '.github/workflows/auth-check.yml'

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina_auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build contracts and API
        run: |
          pnpm --filter @magina/contracts typecheck
          pnpm --filter @magina/contracts build
          pnpm --filter @magina/jobs build
          pnpm --filter @magina/api typecheck
          pnpm --filter @magina/api build

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d magina_auth -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Google identity + session + membership smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina_auth
          ALLOW_DEV_AUTH_HEADERS: 'false'
          AUTH_COOKIE_SECURE: 'false'
        run: node apps/api/dist/testing/auth-smoke.js
