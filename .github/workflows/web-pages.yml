name: Web Pages Preview

on:
  push:
    branches:
      - "feat/web-magína-olivo"
    paths:
      - "web/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "magina-olivo-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build static preview
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: "/magina-olivo-v20"
          SITE_URL: "https://izc05.github.io/magina-olivo-v20"
          ALLOW_INDEXING: "false"
        run: npm run build

      - name: Add nojekyll marker
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
