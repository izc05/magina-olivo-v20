name: V20 commercial notifications check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v20-visual-prototype
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/web/src/app/mi-campo/profesional/**'
      - 'apps/web/src/app/documento-publico/**'
      - 'apps/web/src/components/professional-*.tsx'
      - 'apps/web/src/components/public-commercial-share-client.tsx'
      - 'apps/web/src/components/commercial-notification-settings.tsx'
      - 'apps/web/src/lib/commercial-notification-source.ts'
      - 'packages/contracts/**'
      - 'packages/jobs/**'
      - 'packages/weather/**'
      - 'database/migrations/0035_commercial_notification_preferences.sql'
      - '.github/workflows/commercial-notifications-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commercial-notifications:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @magina/contracts typecheck
      - run: pnpm --filter @magina/contracts build
      - run: pnpm --filter @magina/weather typecheck
      - run: pnpm --filter @magina/weather build
      - run: pnpm --filter @magina/jobs typecheck
      - run: pnpm --filter @magina/jobs build
      - run: pnpm --filter @magina/api typecheck
      - run: pnpm --filter @magina/api build
      - run: pnpm --filter @magina/worker typecheck
      - run: pnpm --filter @magina/worker build
      - run: pnpm --filter @magina/web typecheck
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          for migration in database/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d magina -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Commercial notification smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magina
        run: node apps/worker/dist/testing/commercial-alert-smoke.js
      - run: pnpm --filter @magina/web build
