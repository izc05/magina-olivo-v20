name: V20 routes external KMZ audit

on:
  push:
    branches:
      - feat/v20-routes-catalog-completion
    paths:
      - 'data/routes/sierra-magina-intermodal-hiking.json'
      - 'data/routes/sierra-magina-homologated-trails.json'
      - 'scripts/audit-external-official-kmz.py'
      - '.github/workflows/routes-external-kmz-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit official external KMZ tracks
        id: kmz_audit
        continue-on-error: true
        run: python scripts/audit-external-official-kmz.py --write data/routes/sierra-magina-external-kmz-audit.json

      - name: Print audit summary
        if: always()
        run: |
          if [ -f data/routes/sierra-magina-external-kmz-audit.json ]; then
            python - <<'PY'
          import json
          with open('data/routes/sierra-magina-external-kmz-audit.json', encoding='utf-8') as handle:
              report = json.load(handle)
          print(json.dumps(report.get('summary', {}), indent=2, ensure_ascii=False))
          for row in report.get('routes', []):
              print(row.get('id'), row.get('fetch_status'), row.get('calculated_length_m'), row.get('validation_status'))
          PY
          else
            echo 'Audit report was not generated.'
          fi

      - name: Upload external KMZ audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sierra-magina-external-kmz-audit
          path: data/routes/sierra-magina-external-kmz-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record external-source outcome
        if: always()
        run: |
          echo 'This audit is intentionally non-blocking.'
          echo 'Remote download availability must not determine application CI status.'
