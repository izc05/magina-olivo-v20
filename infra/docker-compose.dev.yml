services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: magina-v20-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: magina
      POSTGRES_PASSWORD: magina
      POSTGRES_DB: magina_v20
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magina -d magina_v20"]
      interval: 10s
      timeout: 5s
      retries: 8
    volumes:
      - magina_v20_pgdata:/var/lib/postgresql/data

volumes:
  magina_v20_pgdata:
