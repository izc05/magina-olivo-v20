name: magina-v20-staging

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    image: postgres:17-bookworm
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../database/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $${migration}"
          psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "$${migration}"
        done
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_COOKIE_SECURE: "true"
      ALLOW_DEV_AUTH_HEADERS: "false"
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-private-documents}
      S3_UPLOAD_TTL_SECONDS: ${S3_UPLOAD_TTL_SECONDS:-900}
      S3_READ_TTL_SECONDS: ${S3_READ_TTL_SECONDS:-600}
      RADAR_S3_PREFIX: ${RADAR_S3_PREFIX:-weather/radar}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      AEMET_API_KEY: ${AEMET_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  worker:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      WORKER_MODULES: ${WORKER_MODULES:-ocr,radar,notifications}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      RADAR_S3_PREFIX: ${RADAR_S3_PREFIX:-weather/radar}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OCR_TESSERACT_LANGUAGES: ${OCR_TESSERACT_LANGUAGES:-spa+eng}
      OCR_MAX_BYTES: ${OCR_MAX_BYTES:-26214400}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-12}
      OCR_TESSERACT_TIMEOUT_MS: ${OCR_TESSERACT_TIMEOUT_MS:-120000}
      OCR_TESSERACT_DPI: ${OCR_TESSERACT_DPI:-250}
      OCR_TESSERACT_PSM: ${OCR_TESSERACT_PSM:-6}
      TESSERACT_BIN: ${TESSERACT_BIN:-tesseract}
      PDFINFO_BIN: ${PDFINFO_BIN:-pdfinfo}
      PDFTOPPM_BIN: ${PDFTOPPM_BIN:-pdftoppm}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      AEMET_API_KEY: ${AEMET_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -Fx ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge
